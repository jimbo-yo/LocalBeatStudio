[package]
name = "localbeat-studio"
description = "LocalBeat Studio: music library, player, CD ripper and phone sync"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "localbeat-studio"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
localbeat-core.workspace = true
localbeat-engine.workspace = true
localbeat-platform.workspace = true
localbeat-player = { path = "../player" }
serde.workspace = true
serde_json.workspace = true
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
anyhow.workspace = true
eframe = "0.37"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
