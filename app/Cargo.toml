[workspace]
resolver = "3"
members = ["core", "platform", "ripshelf"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ripshelf-core = { path = "core" }
ripshelf-platform = { path = "platform" }
anyhow = "1"
cdtoc = { version = "0.13", features = ["accuraterip", "musicbrainz"] }
claxon = "0.4"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }

# Build C dependencies optimized even in debug builds: cmake then compiles
# libFLAC as Release, against the same C runtime as Rust (/MD, not /MDd), and
# encoding/decoding isn't painfully slow while developing.
[profile.dev.package.libflac-sys]
opt-level = 3
debug = false

[profile.dev.package.claxon]
opt-level = 3
