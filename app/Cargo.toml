[workspace]
resolver = "3"
members = ["core", "platform", "engine", "ripshelf", "gui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ripshelf-core = { path = "core" }
ripshelf-platform = { path = "platform" }
ripshelf-engine = { path = "engine" }
anyhow = "1"
cdtoc = { version = "0.13", features = ["accuraterip", "musicbrainz"] }
claxon = "0.4"
lofty = "0.25"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "isomp4", "mp3", "ogg", "vorbis", "wav", "pcm"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
crc32fast = "1"
dirs = "6"
imagesize = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }

# Build C dependencies optimized even in debug builds: cmake then compiles
# libFLAC as Release, against the same C runtime as Rust (/MD, not /MDd), and
# encoding/decoding isn't painfully slow while developing.
# Every library optimised even in debug builds: unoptimised Symphonia made a
# debug-build phone sync crawl (converting AAC/MP3 at a fraction of the
# speed). Our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.libflac-sys]
opt-level = 3
debug = false

[profile.dev.package.claxon]
opt-level = 3

[profile.dev.package.opus-static-sys]
opt-level = 3

[profile.dev.package.libopusenc-static-sys]
opt-level = 3
