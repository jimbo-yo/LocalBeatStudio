[package]
name = "ripshelf-gui"
description = "ripshelf's window: rips disc after disc and shows progress"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ripshelf-gui"
path = "src/main.rs"

[dependencies]
ripshelf-core.workspace = true
ripshelf-engine.workspace = true
ripshelf-platform.workspace = true
ripshelf-player = { path = "../player" }
anyhow.workspace = true
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
