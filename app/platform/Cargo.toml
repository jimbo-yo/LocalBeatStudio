[package]
name = "ripshelf-platform"
description = "OS-specific parts: CD drives, disc detection, phone connections"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ripshelf-core.workspace = true
anyhow.workspace = true
cdtoc.workspace = true
cd-da-reader = "1"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
